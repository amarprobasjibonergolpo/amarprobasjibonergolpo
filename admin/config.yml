
backend:
  name: git-gateway
  repo: amarprobasjibonergolpo/amarprobasjibonergolpo
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "uploads"
public_folder: "/uploads"
locale: "bn"

site_url: "https://amar-probas-jiboner-golpo.netlify.app"

collections:
  - name: "stories"
    label: "প্রবাস জীবনের গল্প"
    folder: "stories"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - name: "title"
        label: "গল্পের শিরোনাম"
        widget: "string"
        required: true

      - name: "date"
        label: "প্রকাশের তারিখ"
        widget: "datetime"
        required: true

      - name: "category"
        label: "গল্পের বিভাগ"
        widget: "string"

      - name: "image"
        label: "গল্পের ছবি"
        widget: "image"
        required: false

      - name: "body"
        label: "গল্প"
        widget: "markdown"
