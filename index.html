<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>আমার প্রবাস জীবনের গল্প</title>
</head>
<body>
  <div id="message"></div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <script>
    const identity = window.netlifyIdentity;

    identity.on("init", user => {
      const hash = window.location.hash;

      if (hash.includes("confirmation_token")) {
        document.getElementById("message").textContent =
          "ইমেইল নিশ্চিত করা হচ্ছে...";
        identity.confirm(hash.replace("#confirmation_token=", ""));
      }

      if (hash.includes("recovery_token")) {
        document.getElementById("message").textContent =
          "পাসওয়ার্ড রিসেটের জন্য লগইন উইন্ডো খুলুন।";
        identity.open("login");
      }
    });
  </script>
</body>
</html>
